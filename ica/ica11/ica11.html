<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

    <style>
        body {
  background-color: lightblue;
  font-family: Arial, sans-serif;
  text-align: center;
}

label {
  font-weight: bold;
}

#custom-name {
  padding: 5px;
  border: 2px solid navy;
}

fieldset {
  border: none;
}

button {
  background-color: blue;
  color: white;
  font-size: 18px;
  padding: 10px;
  border: none;
  cursor: pointer;
}

.story {
  background-color: white;
  padding: 15px;
  margin: 20px;
  font-size: 20px;
}
    </style>
</head>
<body>
    <div>
  <script src="main.js"></script>
  <label for="custom-name">Enter custom name:</label>
  <input id="custom-name" type="text" placeholder="" />
</div>
<fieldset>
  <legend>Choose locale:</legend>
  <label for="us">US</label
  ><input id="us" type="radio" name="uk-us" value="us" checked />
  <label for="uk">UK</label
  ><input id="uk" type="radio" name="uk-us" value="uk" />
</fieldset>
<div>
  <button class="generate">Generate random story</button>
</div>
<!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
<p class="story"></p>
</body>
</html>
